services:
  home-manager:
    container_name: home-manager
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: home-manager-postgres
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_manager}
      POSTGRES_USER: ${POSTGRES_USER:-home_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-home_manager}
    volumes:
      - home-manager-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  home-manager-postgres-data:
